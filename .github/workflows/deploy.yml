name: Deploy Cluster

on:
  workflow_dispatch:
    inputs:
      target:
        description: '可选：仅部署指定 WORKER_NAME（留空则并行部署全部节点）'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_nodes: ${{ steps.plan.outputs.has_nodes }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Plan deployment matrix
        id: plan
        env:
          CLUSTER_NODES_JSON: ${{ secrets.CLUSTER_NODES_JSON }}
          TARGET_NAME: ${{ inputs.target }}
        run: |
          node -e '
            const fs = require("fs");
            const raw = (process.env.CLUSTER_NODES_JSON || "").trim();
            if (!raw) {
              console.error("Missing secret: CLUSTER_NODES_JSON");
              process.exit(1);
            }
            const list = JSON.parse(raw);
            if (!Array.isArray(list) || list.length === 0) {
              console.error("CLUSTER_NODES_JSON must be a non-empty JSON array");
              process.exit(1);
            }
            const target = (process.env.TARGET_NAME || "").trim();
            const items = list
              .map((n, index) => ({ index, name: String((n && n.WORKER_NAME) || `node-${index + 1}`) }))
              .filter(x => !target || x.name === target);
            if (items.length === 0) {
              console.error(`No node matched target="${target}"`);
              process.exit(1);
            }
            const out = process.env.GITHUB_OUTPUT;
            fs.appendFileSync(out, `matrix=${JSON.stringify(items)}\n`);
            fs.appendFileSync(out, `has_nodes=true\n`);
          '

      - name: Install dependencies & build admin console
        run: |
          npm run install:all
          npm run build:web

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: worker/public
          retention-days: 1

  deploy:
    needs: build
    if: needs.build.outputs.has_nodes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.build.outputs.matrix) }}
    name: Deploy (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install worker dependencies
        run: npm --prefix worker ci --no-audit --no-fund

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: worker/public

      - name: Write node env.json & deploy
        env:
          CLUSTER_NODES_JSON: ${{ secrets.CLUSTER_NODES_JSON }}
          NODE_INDEX: ${{ matrix.index }}
          SKIP_INSTALL: '1'
        run: |
          node -e '
            const fs = require("fs");
            const list = JSON.parse(process.env.CLUSTER_NODES_JSON);
            const nodeCfg = list[Number(process.env.NODE_INDEX)];
            if (!nodeCfg || typeof nodeCfg !== "object") throw new Error("Invalid node config");
            fs.writeFileSync("env.json", JSON.stringify(nodeCfg, null, 2));
          '
          node scripts/deploy.mjs

      - name: Clean up sensitive files
        if: always()
        run: rm -f env.json deploy-output.json worker/.secrets.tmp.json
