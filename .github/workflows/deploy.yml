name: Deploy Cluster

on:
  workflow_dispatch:
    inputs:
      target:
        description: '可选：仅部署指定 WORKER_NAME（留空则部署全部节点）'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies & build admin console
        run: |
          npm run install:all
          npm run build:web

      - name: Deploy nodes from CLUSTER_NODES_JSON
        env:
          CLUSTER_NODES_JSON: ${{ secrets.CLUSTER_NODES_JSON }}
          TARGET_NAME: ${{ inputs.target }}
          SKIP_INSTALL: '1'
        run: |
          node -e '
            const fs = require("fs");
            const { execFileSync } = require("child_process");
            const raw = (process.env.CLUSTER_NODES_JSON || "").trim();
            if (!raw) throw new Error("Missing secret: CLUSTER_NODES_JSON");
            const list = JSON.parse(raw);
            if (!Array.isArray(list) || list.length === 0) throw new Error("CLUSTER_NODES_JSON must be a non-empty JSON array");
            const target = (process.env.TARGET_NAME || "").trim();
            const nodes = list.filter(n => !target || (n && n.WORKER_NAME === target));
            if (nodes.length === 0) throw new Error(`No node matched target="${target}"`);
            for (let i = 0; i < nodes.length; i++) {
              const n = nodes[i];
              const name = (n && n.WORKER_NAME) || `node-${i + 1}`;
              console.log(`\n=== Deploying [${name}] ===`);
              fs.writeFileSync("env.json", JSON.stringify(n, null, 2));
              execFileSync("node", ["scripts/deploy.mjs"], { stdio: "inherit" });
            }
          '

      - name: Clean up sensitive files
        if: always()
        run: rm -f env.json deploy-output.json worker/.secrets.tmp.json
